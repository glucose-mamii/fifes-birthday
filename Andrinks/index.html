<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Feliz cumple, fifes!</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    body {
      font-family: 'Bebas Neue', sans-serif;
    }
  </style>
</head>
<body class="bg-gradient-to-br from-white to-purple-100 min-h-screen flex items-center justify-center relative">

  <!-- 🃏 Tarjeta inicial -->
  <div id="card" class="bg-white border-4 border-blue-900 rounded-xl shadow-lg text-center p-6 w-[360px]">
    <img src="https://upload.wikimedia.org/wikipedia/en/thumb/5/56/Real_Madrid_CF.svg/1200px-Real_Madrid_CF.svg.png" class="w-14 mx-auto mb-4" />
    <h1 class="text-2xl text-blue-900 font-bold mb-2">feliz cumple, fifes! 🎂</h1>
    <div class="my-4">
      <div class="bg-gray-100 rounded-lg inline-block px-4 py-2 border-2 border-yellow-400">
        <div class="text-3xl text-blue-800 font-bold">7</div>
      </div>
    </div>
    <p class="text-sm text-gray-500 italic">ARE YOU THE GOAT?</p>
    <button onclick="celebrar()" class="mt-4 bg-yellow-400 text-black font-bold py-2 px-4 rounded shadow hover:bg-yellow-300 transition">CLICK HERE</button>
  </div>

  <!-- 💌 Tarjeta de mensaje -->
  <div id="mensaje" class="hidden bg-blue-900 border-4 border-white rounded-xl shadow-lg text-center p-6 w-[360px] text-white absolute">
    <h2 class="text-xl font-bold mb-3">GOAT CERTIFICADO!</h2>
    <p class="text-sm mb-4 leading-tight whitespace-pre-wrap" id="typed-text"></p>
    <img  
    src="nosotros.jpg" 
    alt="XOXO>" 
    class="rounded-lg w-32 h-32 object-cover mt-2 border-4 border-white mx-auto"
  XOXO
  
/>XOXO
  </div>

  <!-- 🎵 Audio personalizado -->
  <audio id="audio" src="Danny Ocean - Vuelve (Official Audio).mp3" preload="auto"></audio>

  <!-- 💥 Script -->
  <script>
    const mensaje = `aunque el madrid no haya sido el goat este año,\ntú siempre lo serás! 🐐✨\n(por tu horóscopo chino, digo jsjdfsjfjs😆)\nfeliz cumple, flaco <3. Gracias por tanto en tan poco y por ser una persona incréible. Te amo. `;

    function celebrar() {
      document.getElementById('card').classList.add('hidden');
      document.getElementById('mensaje').classList.remove('hidden');

      const audio = document.getElementById('audio');
      audio.play();

      confetti({
        particleCount: 200,
        spread: 60,
        origin: { y: 0.6 }
      });

      escribirMensaje(mensaje, 'typed-text', 45);
    }

    function escribirMensaje(texto, id, velocidad) {
      const elemento = document.getElementById(id);
      let i = 0;
      elemento.innerText = '';
      const intervalo = setInterval(() => {
        elemento.innerText += texto[i];
        i++;
        if (i === texto.length) clearInterval(intervalo);
      }, velocidad);
    }
  </script>
</body>
</html>
